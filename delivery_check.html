<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจเช็คและส่งมอบสินค้า (Dispatch Checklist)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header & Controls -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-black text-slate-800 flex items-center gap-2">
            📦 รายการรอจัดส่งสินค้า
          </h1>
          <p class="text-xs text-slate-500 mt-1">ยืนยันการส่งมอบสินค้าให้ฝ่ายขายหน้างาน (เรียงรายการรอส่งไว้บนสุด)</p>
        </div>
        <button onclick="fetchTransactions()" class="bg-indigo-50 text-indigo-600 px-4 py-2.5 rounded-xl font-bold text-xs hover:bg-indigo-100 transition-all flex items-center gap-1.5 active:scale-95">
          🔄 อัปเดตรายการ
        </button>
      </div>

      <!-- Mode Switcher & Filter Controls -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-100">
        <!-- เลือกโหมดจุดจ่ายสินค้า -->
        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">เลือกจุดจ่ายสินค้า (Mode)</label>
          <select id="station-mode" onchange="renderOrders()" class="w-full bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-sm font-bold text-amber-900 outline-none focus:ring-2 focus:ring-amber-500">
            <option value="water">💧 จุดรับน้ำ / เครื่องดื่มทั่วไป</option>
            <option value="beer">🍺 จุดรับเบียร์</option>
            <option value="all">📦 แสดงสินค้าทั้งหมด (All)</option>
          </select>
        </div>

        <!-- Dropdown เลือกงาน/อีเวนต์ -->
        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">เลือกชื่องาน (Event)</label>
          <select id="event-select" onchange="fetchTransactions()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500" disabled>
            <option value="">-- กำลังโหลดรายการงาน... --</option>
          </select>
        </div>

        <!-- ค้นหาชื่อผู้ขาย -->
        <div>
          <label class="text-[10px] font-bold uppercase text-slate-400 block mb-1">ค้นหาชื่อคนขาย</label>
          <div class="relative">
            <input type="text" id="seller-search" oninput="renderOrders()" placeholder="พิมพ์ชื่อคนขาย..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-indigo-500 pl-8">
            <span class="absolute left-2.5 top-2.5 text-slate-400 text-xs">🔍</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Counter Badges -->
    <div class="flex gap-3 mb-4 text-xs font-bold">
      <div class="bg-amber-100 text-amber-800 px-3 py-1.5 rounded-xl border border-amber-200 flex items-center gap-1.5">
        <span>⏳ ยังไม่ส่ง:</span>
        <span id="pending-count" class="font-black text-sm">0</span>
      </div>
      <div class="bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-xl border border-emerald-200 flex items-center gap-1.5">
        <span>✅ ส่งแล้ว:</span>
        <span id="delivered-count" class="font-black text-sm">0</span>
      </div>
    </div>

    <!-- Order List Container -->
    <div id="orders-list" class="space-y-4">
      <div class="text-center py-12 text-slate-400 font-bold animate-pulse">กำลังโหลดรายการขาย...</div>
    </div>
  </div>

  <script>
    let rawTransactions = [];

    async function init() {
      await loadEvents();
      await fetchTransactions();
    }

    // 1. โหลดรายชื่อ Events ทั้งหมด และเลือกงานล่าสุดเป็นค่าเริ่มต้น
    async function loadEvents() {
      const { data: events } = await _supabase
        .from('events')
        .select('id, event_name')
        .order('created_at', { ascending: false });

      const select = document.getElementById('event-select');
      if (events && events.length > 0) {
        select.innerHTML = '';
        events.forEach(ev => {
          const opt = document.createElement('option');
          opt.value = ev.id;
          opt.innerText = ev.event_name;
          select.appendChild(opt);
        });
        // กำหนดให้เลือกงานล่าสุดเสมอ
        select.value = events[0].id;
      }
    }

    // 2. ดึงรายการขายจาก Supabase
    async function fetchTransactions() {
      const container = document.getElementById('orders-list');
      const selectedEventId = document.getElementById('event-select').value;

      let query = _supabase
        .from('sales_transactions')
        .select('*')
        .order('sold_at', { ascending: false })
        .limit(1000);

      if (selectedEventId) {
        query = query.eq('event_id', selectedEventId);
      }

      const { data, error } = await query;

      if (error) {
        container.innerHTML = `<div class="p-6 bg-red-50 text-red-500 rounded-2xl text-center font-bold">เกิดข้อผิดพลาด: ${error.message}</div>`;
        return;
      }

      rawTransactions = data || [];
      renderOrders();
    }

    // ฟังก์ชันช่วยเช็คว่าเป็นสินค้าประเภทเบียร์หรือไม่
    function isBeerProduct(productName) {
      if (!productName) return false;
      const lower = productName.toLowerCase();
      return lower.includes('เบียร์') || lower.includes('beer');
    }

    // 3. ประมวลผล คัดกรอง และแสดงผลรายการ
    function renderOrders() {
      const container = document.getElementById('orders-list');
      const searchKeyword = document.getElementById('seller-search').value.toLowerCase().trim();
      const mode = document.getElementById('station-mode').value; // 'water', 'beer', หรือ 'all'

      if (rawTransactions.length === 0) {
        container.innerHTML = `<div class="p-12 bg-white rounded-3xl text-center text-slate-400 italic shadow-sm">ยังไม่มีรายการขายในระบบ</div>`;
        document.getElementById('pending-count').innerText = 0;
        document.getElementById('delivered-count').innerText = 0;
        return;
      }

      let processed = [];

      rawTransactions.forEach(tx => {
        const details = tx.details || [];
        let allItems = [];
        let sellerName = 'ไม่ระบุชื่อ';
        let isDeliveredWater = false;
        let isDeliveredBeer = false;

        // แยกข้อมูล details ทั้งแบบ Array และ Object
        if (Array.isArray(details)) {
          allItems = details;
          sellerName = details[0]?.seller_name || 'ไม่ระบุชื่อ';
          isDeliveredWater = details[0]?.is_delivered === true;
          isDeliveredBeer = details[0]?.is_delivered_beer === true;
        } else if (typeof details === 'object' && details !== null) {
          allItems = details.items || [];
          sellerName = details.seller_name || 'ไม่ระบุชื่อ';
          isDeliveredWater = details.is_delivered === true;
          isDeliveredBeer = details.is_delivered_beer === true;
        }

        // กรองรายการสินค้าตาม Mode ที่เลือก
        const filteredItems = allItems.filter(item => {
          const isBeer = isBeerProduct(item.name || tx.product_name);
          if (mode === 'beer') return isBeer;
          if (mode === 'water') return !isBeer;
          return true; // mode === 'all'
        });

        // กำหนดสถานะการส่งมอบตาม Mode
        let isDeliveredCurrent = false;
        if (mode === 'beer') {
          isDeliveredCurrent = isDeliveredBeer;
        } else if (mode === 'water') {
          isDeliveredCurrent = isDeliveredWater;
        } else {
          // โหมด All: ให้ถือว่าส่งแล้วเมื่อส่งครบทั้งน้ำและเบียร์ (หรือถ้าไม่มีรายการเบียร์ให้เช็คแค่น้ำ)
          const hasBeer = allItems.some(i => isBeerProduct(i.name));
          isDeliveredCurrent = hasBeer ? (isDeliveredWater && isDeliveredBeer) : isDeliveredWater;
        }

        if (filteredItems.length > 0) {
          processed.push({
            ...tx,
            parsedItems: filteredItems,
            sellerName: sellerName,
            isDeliveredCurrent: isDeliveredCurrent
          });
        }
      });

      // กรองตามชื่อคนขาย
      if (searchKeyword) {
        processed = processed.filter(item => item.sellerName.toLowerCase().includes(searchKeyword));
      }

      // จัดเรียง: รายการที่ยังไม่ส่งไว้บนสุด
      processed.sort((a, b) => {
        if (a.isDeliveredCurrent === b.isDeliveredCurrent) {
          return new Date(b.sold_at) - new Date(a.sold_at);
        }
        return a.isDeliveredCurrent ? 1 : -1;
      });

      // อัปเดตตัวเลข Badge
      const pending = processed.filter(i => !i.isDeliveredCurrent).length;
      const delivered = processed.filter(i => i.isDeliveredCurrent).length;
      document.getElementById('pending-count').innerText = pending;
      document.getElementById('delivered-count').innerText = delivered;

      if (processed.length === 0) {
        container.innerHTML = `<div class="p-12 bg-white rounded-3xl text-center text-slate-400 italic shadow-sm">ไม่มีรายการสินค้าสำหรับจุดจ่ายนี้</div>`;
        return;
      }

      // เรนเดอร์การ์ดรายการขาย
      const modeLabel = mode === 'beer' ? 'เบียร์' : (mode === 'water' ? 'น้ำ/ทั่วไป' : 'ทั้งหมด');

      container.innerHTML = processed.map(tx => {
        const time = new Date(tx.sold_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        return `
          <div class="bg-white rounded-3xl p-6 shadow-sm border ${tx.isDeliveredCurrent ? 'border-slate-200 bg-slate-50/50 opacity-75' : 'border-amber-300 ring-2 ring-amber-100'} transition-all relative overflow-hidden">
            ${!tx.isDeliveredCurrent ? `<div class="absolute top-0 right-0 bg-amber-500 text-white font-black text-[9px] px-3 py-1 rounded-bl-xl uppercase tracking-wider shadow-sm">⏳ รอส่งของ (${modeLabel})</div>` : ''}

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-4 mb-4 gap-2">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="bg-slate-100 text-slate-600 font-mono text-xs font-bold px-2.5 py-1 rounded-lg">⏰ ${time} น.</span>
                  <span class="bg-indigo-50 text-indigo-700 font-bold text-xs px-3 py-1 rounded-lg">👤 ผู้ขาย: ${tx.sellerName}</span>
                </div>
                <p class="text-xs text-slate-400 font-mono">TX-ID: ${tx.id.substring(0, 8)}...</p>
              </div>
              <div class="text-right">
                <span class="text-lg font-black text-slate-800">${tx.amount.toLocaleString()}.-</span>
                <span class="text-[10px] font-bold block ${tx.payment_method === 'transfer' ? 'text-sky-500' : 'text-emerald-500'} uppercase">${tx.payment_method === 'transfer' ? '📱 โอน/QR' : '💵 เงินสด'}</span>
              </div>
            </div>

            <!-- รายการสินค้า -->
        <div class="mb-5 space-y-2">
              <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">รายการสินค้า (${modeLabel}):</p>
              ${tx.parsedItems.map(item => {
                console.log(item);
                const isBeer = isBeerProduct(item.name);
                const itemDelivered = isBeer ? item.is_delivered_beer : item.is_delivered;

                return `
                  <div class="flex justify-between items-center bg-slate-50 px-4 py-2.5 rounded-xl border border-slate-100">
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-slate-800 text-sm">${item.name}</span>
                      ${mode === 'all' ? `
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${itemDelivered ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                          ${itemDelivered ? '✅ รับแล้ว' : '⏳ ยังไม่รับ'}
                        </span>
                      ` : ''}
                    </div>
                    <span class="font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg text-sm">x ${item.qty}</span>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- ปุ่มสถานะการรับของ -->
            <div class="flex justify-end pt-2 border-t border-slate-100">
              ${tx.isDeliveredCurrent ? `
                <div class="flex items-center gap-2 text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl text-xs font-bold border border-emerald-100">
                  <span>✅ ฝ่ายขายรับสินค้า (${modeLabel}) เรียบร้อยแล้ว</span>
                </div>
              ` : `
                <button onclick="toggleDeliveryStatus('${tx.id}', ${JSON.stringify(tx.details).replace(/"/g, '&quot;')}, '${mode}')"
                  class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-2xl text-xs shadow-lg shadow-amber-200 active:scale-95 transition-all flex items-center gap-2">
                  <span>📦 กด ยืนยันส่งมอบ (${modeLabel})</span>
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    // 4. อัปเดตสถานะการส่งมอบเข้า Supabase
    async function toggleDeliveryStatus(txId, currentDetails, mode) {
      const modeText = mode === 'beer' ? 'เบียร์' : (mode === 'water' ? 'น้ำ/เครื่องดื่มทั่วไป' : 'ทุกรายการ');
      if (!confirm(`ยืนยันว่าได้ส่งมอบสินค้า (${modeText}) ให้ฝ่ายขายเรียบร้อยแล้วใช่ไหม?`)) return;

      let updatedDetails;
      const nowIso = new Date().toISOString();

      const applyStatusUpdate = (item) => {
        const updated = { ...item };
        if (mode === 'beer') {
          updated.is_delivered_beer = true;
          updated.delivered_beer_at = nowIso;
        } else if (mode === 'water') {
          updated.is_delivered = true;
          updated.delivered_at = nowIso;
        } else {
          // ถ้ากดจากโหมด All ให้ตั้งอัปเดตทั้งคู่
          updated.is_delivered = true;
          updated.delivered_at = nowIso;
          updated.is_delivered_beer = true;
          updated.delivered_beer_at = nowIso;
        }
        return updated;
      };

      if (Array.isArray(currentDetails)) {
        updatedDetails = currentDetails.map(applyStatusUpdate);
      } else if (typeof currentDetails === 'object' && currentDetails !== null) {
        updatedDetails = applyStatusUpdate(currentDetails);
      } else {
        updatedDetails = mode === 'beer'
          ? { is_delivered_beer: true, delivered_beer_at: nowIso }
          : { is_delivered: true, delivered_at: nowIso };
      }

      const { error } = await _supabase
        .from('sales_transactions')
        .update({ details: updatedDetails })
        .eq('id', txId);

      if (error) {
        alert('เกิดข้อผิดพลาดในการอัปเดต: ' + error.message);
      } else {
        await fetchTransactions();
      }
    }

    // เริ่มต้นทำงานและตั้ง Auto-refresh ทุก 10 วินาที
    init();
    setInterval(fetchTransactions, 10000);
  </script>
</body>

</html>
