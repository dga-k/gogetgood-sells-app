<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบขายสินค้า - QR Code Only</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; }
        .product-card:active { transform: scale(0.96); transition: 0.1s; }
        .product-grid-container {
            height: calc(100vh - 420px);
            overflow-y: auto;
            padding-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .truncate-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        #cart-items-list::-webkit-scrollbar { display: none; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="antialiased">

    <!-- Header -->
    <header class="bg-indigo-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div>
                    <h1 id="display-booth-name" class="text-sm font-bold leading-none">🏪 กำลังโหลด...</h1>
                    <p id="display-event-name" class="text-[9px] opacity-75 uppercase">รอสักครู่...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- แสดงชื่อผู้ขายปัจจุบัน -->
                <button onclick="promptSellerName()" class="bg-white/20 px-3 py-1.5 rounded-xl border border-white/30 text-left active:scale-95 transition-all">
                    <span class="text-[8px] opacity-75 block font-bold uppercase">ผู้ขายปัจจุบัน</span>
                    <span id="display-seller-name" class="text-xs font-black block truncate max-w-[90px]">ยังไม่ระบุ</span>
                </button>
                <div class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-xl text-center border border-white/30">
                    <span id="cart-count" class="block text-xl font-black">0</span>
                    <span class="text-[9px] font-bold uppercase">ชิ้น</span>
                </div>
            </div>
        </div>
    </header>

    <main class="p-5">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-slate-500 text-xs font-black uppercase tracking-widest">เลือกรายการสินค้า (QR Code Only)</h2>
            <span id="stock-status" class="text-[10px] text-slate-400">เลื่อนดูสินค้าได้ ↓</span>
        </div>
        
        <div class="product-grid-container">
            <div id="product-grid" class="grid grid-cols-2 gap-3"></div>
        </div>
    </main>

    <!-- Bottom Cart Panel -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] px-4 pt-3 safe-area-bottom z-50 rounded-t-[2.5rem]">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-3"></div>

        <div id="cart-items-list" class="max-h-28 overflow-y-auto mb-3 space-y-2">
            <p class="text-center text-slate-300 text-sm py-4 italic">ยังไม่มีสินค้าในตะกร้า</p>
        </div>

        <div class="flex justify-between items-end mb-3 border-t border-slate-100 pt-3">
            <div>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-tight">ยอดรวมสุทธิ</p>
                <p id="total-price" class="text-3xl font-black text-indigo-700">0.-</p>
            </div>
            <button onclick="confirmClearCart()" class="text-red-400 text-xs font-bold bg-red-50 px-4 py-2 rounded-xl hover:bg-red-100 transition-colors">
                ล้างทั้งหมด
            </button>
        </div>
        
        <button id="btn-qr" onclick="openQRModal()" class="w-full bg-sky-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg shadow-sky-200 active:scale-95 transition-all mb-2 flex items-center justify-center gap-2">
            📱 ชำระเงินผ่าน QR Code
        </button>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center">
            <h2 class="text-xl font-black mb-1">สแกนเพื่อชำระเงิน</h2>
            <p id="qr-total-text" class="text-indigo-600 font-black text-2xl mb-4">0.-</p>
            
            <div class="bg-gray-50 p-4 rounded-2xl mb-4 flex justify-center border-2 border-dashed border-gray-200">
                <img id="qr-img" src="" alt="PromptPay QR" class="w-48 h-48">
            </div>

            <p class="text-xs text-slate-400 mb-4">ผู้ขาย: <strong id="qr-seller-label" class="text-slate-700">-</strong></p>
            
            <div class="flex gap-2">
                <button onclick="closeModal('qr-modal')" class="flex-1 py-3 font-bold text-gray-500 bg-gray-100 rounded-xl">ยกเลิก</button>
                <button onclick="confirmPayment()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg">ยืนยันรับเงินแล้ว</button>
            </div>
        </div>
    </div>

    <!-- Modal ตั้งชื่อผู้ขายครั้งแรก -->
    <div id="seller-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-xs shadow-2xl text-center">
            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">👤</div>
            <h2 class="text-lg font-black text-slate-800 mb-1">ระบุชื่อผู้ขายประจำเครื่อง</h2>
            <p class="text-xs text-slate-400 mb-4">ชื่อนี้จะถูกบันทึกค้างไว้เพื่อส่งประกอบกับประวัติการขายทุกรายการ</p>
            
            <input type="text" id="seller-input" placeholder="พิมพ์ชื่อของคุณ..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-center font-bold text-slate-800 mb-4 outline-none focus:ring-2 focus:ring-indigo-500">
            
            <button onclick="saveSellerName()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-indigo-700">
                เริ่มทำรายการขาย
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const bId = params.get('id');
        const evId = params.get('event_id');
        let cart = [];
        let masterStock = [];
        let currentStockBoothId = null;
        let currentSeller = localStorage.getItem('app_seller_name') || '';

        async function init() {
            checkSellerName();
            await getBoothDetail();
            currentStockBoothId = await determineStockBooth(); 
            await loadProducts();
        }

        function checkSellerName() {
            if (!currentSeller) {
                document.getElementById('seller-modal').classList.remove('hidden');
            } else {
                document.getElementById('display-seller-name').innerText = currentSeller;
            }
        }

        function saveSellerName() {
            const name = document.getElementById('seller-input').value.trim();
            if (!name) return alert('กรุณากรอกชื่อผู้ขายก่อนครับ');
            localStorage.setItem('app_seller_name', name);
            currentSeller = name;
            document.getElementById('display-seller-name').innerText = currentSeller;
            document.getElementById('seller-modal').classList.add('hidden');
        }

        function promptSellerName() {
            document.getElementById('seller-input').value = currentSeller;
            document.getElementById('seller-modal').classList.remove('hidden');
        }

        async function getBoothDetail() {
            const { data } = await _supabase.from('booths').select('booth_name, events(event_name)').eq('id', bId).single();
            if (data) {
                document.getElementById('display-booth-name').innerText = `🏪 ${data.booth_name}`;
                document.getElementById('display-event-name').innerText = data.events.event_name;
            }
        }

        async function determineStockBooth() {
            const { data: event } = await _supabase.from('events').select('stock_mode').eq('id', evId).single();
            if (event && event.stock_mode === 'shared') {
                const { data: centralBooth } = await _supabase.from('booths').select('id').eq('event_id', evId).eq('booth_name', 'คลังกลาง').single();
                if (centralBooth) return centralBooth.id;
            }
            return bId;
        }

        async function loadProducts() {
            if (!currentStockBoothId) return;
            const { data } = await _supabase.from('booth_inventory')
                .select(`stock_qty, products(id, name, price, color_code, sort_order, is_enabled)`)
                .eq('booth_id', currentStockBoothId)
                .eq('products.is_enabled', true)
                .order('products(sort_order)', { ascending: true });
            
            masterStock = data || [];
            const grid = document.getElementById('product-grid');
            
            grid.innerHTML = masterStock.map(item => {
                if (!item.products) return ''; 
                const p = item.products;
                const isOut = item.stock_qty <= 0;
                const color = p.color_code || '#F5F5F5';
                const bgColor = color + '20';

                return `
                <button onclick="addToCart('${p.id}', '${p.name}', ${p.price})" ${isOut ? 'disabled' : ''}
                        class="product-card bg-white rounded-2xl border border-slate-100 shadow-sm text-left relative overflow-hidden flex flex-col h-20 transition-all active:scale-95 ${isOut ? 'opacity-50 grayscale' : ''}"
                        style="border-left: 6px solid ${color}">
                    <div class="p-3 flex flex-col justify-between h-full w-full" style="background-color: ${bgColor}">
                        <div>
                            <p class="font-bold text-slate-800 text-xs leading-tight mb-0.5 truncate-text">${p.name || 'ไม่มีชื่อสินค้า'}</p>
                            <p class="text-indigo-600 font-black text-base">${p.price || 0}.-</p>
                        </div>
                    </div>
                    ${isOut ? `<div class="absolute inset-0 bg-white/40 flex items-center justify-center"><span class="bg-red-500 text-white text-[9px] px-2 py-1 rounded-lg font-bold rotate-12 uppercase">Out of Stock</span></div>` : ''}
                </button>
                `;
            }).join('');
        }

        function addToCart(id, name, price) {
            const productStock = masterStock.find(s => s.products.id === id);
            const existing = cart.find(item => item.id === id);
            const currentQty = existing ? existing.qty : 0;

            if (currentQty + 1 > productStock.stock_qty) {
                alert(`❌ สินค้า "${name}" ไม่พอขาย (คงเหลือ ${productStock.stock_qty})`);
                return;
            }

            if (existing) { existing.qty++; } else { cart.push({ id, name, price, qty: 1 }); }
            updateUI();
        }

        function removeFromCart(id) {
            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                cart[index].qty--;
                if (cart[index].qty <= 0) cart.splice(index, 1);
            }
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-center text-slate-300 text-sm py-4 italic">ยังไม่มีสินค้าในตะกร้า</p>';
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="flex-1 min-w-0 pr-2">
                            <p class="text-xs font-black text-slate-700 truncate-text">${item.name}</p>
                            <p class="text-[10px] font-bold text-indigo-500">${item.price}.- / ชิ้น</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <button onclick="removeFromCart('${item.id}')" class="w-8 h-8 rounded-full bg-white shadow-sm border border-slate-200 text-red-500 flex items-center justify-center font-black">-</button>
                            <span class="font-black text-slate-800 text-sm w-4 text-center">${item.qty}</span>
                            <button onclick="addToCart('${item.id}', '${item.name}', ${item.price})" class="w-8 h-8 rounded-full bg-white shadow-sm border border-slate-200 text-emerald-500 flex items-center justify-center font-black">+</button>
                        </div>
                    </div>
                `).join('');
            }

            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.qty * item.price), 0);
            document.getElementById('cart-count').innerText = count;
            document.getElementById('total-price').innerText = total.toLocaleString() + '.-';
        }

        async function openQRModal() {
            if (!currentSeller) return promptSellerName();
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            if (total <= 0) return alert('กรุณาเลือกสินค้าก่อนครับ');

            const { data: booth } = await _supabase.from('booths').select('qr_code_number').eq('id', bId).single();
            const { data: event } = await _supabase.from('events').select('qr_code_number').eq('id', evId).single();

            let targetQR = booth?.qr_code_number || event?.qr_code_number;
            if (!targetQR) return alert('⚠️ ไม่พบข้อมูลเบอร์ PromptPay QR ในระบบ');

            targetQR = targetQR.replace(/-/g, "");
            document.getElementById('qr-img').src = `https://promptpay.io/${targetQR}/${total}.png`;
            document.getElementById('qr-total-text').innerText = total.toLocaleString() + '.-';
            document.getElementById('qr-seller-label').innerText = currentSeller;

            document.getElementById('qr-modal').classList.remove('hidden');
        }

        async function confirmPayment() {
            const btn = document.getElementById('btn-qr');
            btn.disabled = true;

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const qty = cart.reduce((sum, i) => sum + i.qty, 0);
            const summaryText = cart.map(i => `${i.name} x${i.qty}`).join(', ');

            // ส่งข้อมูลเป็น Array เพื่อแก้ปัญหา "cannot get array length of a non-array"
           const detailsPayload = cart.map(item => {
                // เช็กว่าชื่อสินค้ามีคำว่า beer หรือไม่ (แปลงเป็นตัวพิมพ์เล็กก่อนเช็ก)
                const isBeer = item.name.toLowerCase().includes('beer') || item.name.includes('เบียร์');

                return {
                    id: item.id,
                    name: item.name,
                    price: item.price,
                    qty: item.qty,
                    seller_name: currentSeller,
                    is_delivered: false,
                    is_delivered_beer: isBeer ? false : null // หรือจะใส่ false เสมอก็ได้ตาม Data Structure ที่ออกแบบไว้ครับ
                };
            });

            const { error } = await _supabase.rpc('handle_sale_with_booth_stock', {
                p_booth_id: bId,
                p_event_id: evId,
                p_product_name: summaryText,
                p_amount: total,
                p_quantity: qty,
                p_payment_method: 'transfer',
                p_details: detailsPayload
            });

            if (!error) {
                alert('🎉 ชำระเงินสำเร็จ บันทึกการขายเรียบร้อย!');
                cart = [];
                updateUI();
                closeModal('qr-modal');
                await loadProducts();
            } else {
                alert('❌ เกิดข้อผิดพลาด: ' + error.message);
            }
            btn.disabled = false;
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function confirmClearCart() { if (cart.length > 0 && confirm("ล้างตะกร้า?")) { cart = []; updateUI(); } }

        init();
    </script>
</body>
</html>
