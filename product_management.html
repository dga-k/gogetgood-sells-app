<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Stock Pro - Product Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
    <div class="max-w-5xl mx-auto p-4 md:p-8">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <a href="index.html" class="text-sm font-bold text-indigo-600 hover:text-indigo-800 transition-colors">← กลับหน้าหลักแดชบอร์ด</a>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight mt-1">📦 จัดการรายการสินค้า</h1>
                <p class="text-gray-500 text-sm">เพิ่ม ลบ แก้ไข ข้อมูลสินค้า ราคากลาง และโค้ดสีระบุสินค้า</p>
            </div>
            <button onclick="openAddProductModal()" class="w-full sm:w-auto bg-indigo-600 text-white px-6 py-3.5 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                <span>+ เพิ่มสินค้าใหม่</span>
            </button>
        </header>

        <main class="bg-white rounded-3xl shadow-xl shadow-slate-100 border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-600 uppercase text-xs tracking-wider border-b border-slate-100">
                        <tr>
                            <th class="p-5 font-bold pl-8">สีสินค้า</th>
                            <th class="p-5 font-bold">ลำดับ</th>
                            <th class="p-5 font-bold">ชื่อสินค้า</th>
                            <th class="p-5 font-bold text-right">ราคากลาง (บาท)</th>
                            <th class="p-5 font-bold text-center">จำนวนต่อแพ็ค</th>
                            <th class="p-5 font-bold text-center">การจัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <tr>
                            <td colspan="6" class="p-10 text-center text-slate-400 animate-pulse font-bold">กำลังโหลดข้อมูลสินค้า...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="product-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl transition-all scale-100">
            <h2 id="modal-title" class="text-2xl font-bold mb-6 text-slate-800">เพิ่มสินค้าเข้าระบบ</h2>
            <input type="hidden" id="product-modal-id">
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 block mb-1">ชื่อสินค้า</label>
                    <input type="text" id="modal-product-name" placeholder="เช่น น้ำดื่มสิงห์ 500มล." class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                </div>
                
                <div>
                    <label class="text-xs font-bold text-slate-400 block mb-2">โค้ดสีประจำสินค้า (สำหรับแยกประเภทบนหน้าจอขาย)</label>
                    <div class="flex items-center gap-3 mb-3">
                        <input type="color" id="modal-product-color-picker" oninput="document.getElementById('modal-product-color').value = this.value" class="w-14 h-14 bg-transparent border-0 cursor-pointer rounded-xl">
                        <input type="text" id="modal-product-color" placeholder="#4f46e5" maxlength="7" oninput="document.getElementById('modal-product-color-picker').value = this.value" class="flex-1 p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-mono font-bold uppercase">
                    </div>
                    <div class="flex flex-wrap gap-2 pt-1">
                        <button type="button" onclick="setQuickColor('#4f46e5')" class="w-6 h-6 rounded-full bg-[#4f46e5] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#ef4444')" class="w-6 h-6 rounded-full bg-[#ef4444] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#f59e0b')" class="w-6 h-6 rounded-full bg-[#f59e0b] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#10b981')" class="w-6 h-6 rounded-full bg-[#10b981] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#06b6d4')" class="w-6 h-6 rounded-full bg-[#06b6d4] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#ec4899')" class="w-6 h-6 rounded-full bg-[#ec4899] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#8b5cf6')" class="w-6 h-6 rounded-full bg-[#8b5cf6] border border-black/10"></button>
                        <button type="button" onclick="setQuickColor('#64748b')" class="w-6 h-6 rounded-full bg-[#64748b] border border-black/10"></button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">ราคาขายปกติ (บาท)</label>
                        <input type="number" id="modal-product-price" placeholder="0" min="0" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">จำนวนสินค้าต่อแพ็ค</label>
                        <input type="number" id="modal-product-pack" value="1" min="1" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 block mb-1">ลำดับการเรียงบนหน้าจอ (น้อยอยู่บนสุด)</label>
                    <input type="number" id="modal-product-sort" value="10" min="1" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                </div>
            </div>

            <div class="flex justify-between items-center mt-8 gap-2">
                <button id="delete-product-btn" class="hidden text-red-500 hover:bg-red-50 px-4 py-4 rounded-2xl font-bold text-sm border border-red-100 transition-colors">ลบสินค้านี้</button>
                <div class="flex gap-2 flex-1 justify-end">
                    <button onclick="closeProductModal()" class="py-4 px-4 font-bold text-slate-400 hover:text-slate-600 transition-colors">ยกเลิก</button>
                    <button id="save-product-btn" class="bg-indigo-600 text-white py-4 px-6 rounded-2xl font-bold hover:bg-indigo-700 shadow-md shadow-indigo-100 transition-all">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const openModal = (id) => document.getElementById(id).classList.remove('hidden');
        const closeModal = (id) => document.getElementById(id).classList.add('hidden');

        // ฟังก์ชันช่วยเปลี่ยนค่าสีแบบเร็ว
        function setQuickColor(hex) {
            document.getElementById('modal-product-color').value = hex;
            document.getElementById('modal-product-color-picker').value = hex;
        }

        function openAddProductModal() {
            document.getElementById('modal-title').innerText = "📦 เพิ่มสินค้าใหม่";
            document.getElementById('product-modal-id').value = "";
            document.getElementById('modal-product-name').value = "";
            document.getElementById('modal-product-price').value = "";
            document.getElementById('modal-product-pack').value = "1";
            document.getElementById('modal-product-sort').value = "10";
            setQuickColor('#4f46e5'); // เซ็ตสีเริ่มต้นเป็นคราม
            document.getElementById('delete-product-btn').classList.add('hidden');
            openModal('product-modal');
        }

        function openEditProductModal(id, name, price, pack, sortOrder, colorCode) {
            document.getElementById('modal-title').innerText = "⚙️ แก้ไขข้อมูลสินค้า";
            document.getElementById('product-modal-id').value = id;
            document.getElementById('modal-product-name').value = name;
            document.getElementById('modal-product-price').value = price;
            document.getElementById('modal-product-pack').value = pack;
            document.getElementById('modal-product-sort').value = sortOrder === 'null' ? '10' : sortOrder;
            
            // ตรวจสอบและแสดงค่ารหัสสีดั้งเดิม
            const validColor = (colorCode && colorCode !== 'null' && colorCode !== 'undefined') ? colorCode : '#4f46e5';
            setQuickColor(validColor);

            document.getElementById('delete-product-btn').classList.remove('hidden');
            openModal('product-modal');
        }

        function closeProductModal() {
            closeModal('product-modal');
        }

        async function fetchAllProducts() {
            const tbody = document.getElementById('product-table-body');
            
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('sort_order', { ascending: true })
                .order('name', { ascending: true });

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-red-500 font-bold">ไม่สามารถโหลดข้อมูลสินค้าได้: ${error.message}</td></tr>`;
                return;
            }

            if (!products || products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-10 text-center text-slate-400 italic">ยังไม่มีข้อมูลสินค้าในระบบ สั่งเพิ่มได้เลยครับ!</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map((p) => {
                const itemColor = p.color_code || '#4f46e5';
                return `
                <tr class="hover:bg-slate-50/80 border-b border-slate-50 transition-colors">
                    <td class="p-5 pl-8 text-center w-20">
                        <div class="w-7 h-7 rounded-full shadow-inner border border-black/10 mx-auto" style="background-color: ${itemColor}" title="${itemColor}"></div>
                    </td>
                    <td class="p-5 font-bold text-slate-400 text-sm"># ${p.sort_order ?? 10}</td>
                    <td class="p-5">
                        <div class="font-bold text-slate-800 text-base flex items-center gap-2">
                            <span>${p.name}</span>
                        </div>
                        <div class="text-xs text-slate-300 select-all font-mono">${p.id}</div>
                    </td>
                    <td class="p-5 text-right font-bold text-indigo-600 text-base">฿${(p.price || 0).toLocaleString()}</td>
                    <td class="p-5 text-center">
                        <span class="bg-slate-100 text-slate-600 font-bold px-3 py-1 rounded-full text-xs">${p.items_per_pack || 1} ชิ้น/แพ็ค</span>
                    </td>
                    <td class="p-5 text-center">
                        <button onclick="openEditProductModal('${p.id}', '${p.name}', ${p.price}, ${p.items_per_pack || 1}, ${p.sort_order ?? 10}, '${itemColor}')" class="bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-bold px-4 py-2 rounded-xl text-xs transition-colors shadow-sm">
                            แก้ไข / ลบ
                        </button>
                    </td>
                </tr>
            `}).join('');
        }

        document.getElementById('save-product-btn').addEventListener('click', async () => {
            const pId = document.getElementById('product-modal-id').value;
            const name = document.getElementById('modal-product-name').value.trim();
            const price = parseFloat(document.getElementById('modal-product-price').value);
            const pack = parseInt(document.getElementById('modal-product-pack').value) || 1;
            const sort = parseInt(document.getElementById('modal-product-sort').value) || 10;
            let color = document.getElementById('modal-product-color').value.trim() || '#4f46e5';

            if (!color.startsWith('#')) color = '#' + color;

            if (!name || isNaN(price)) {
                return alert('⚠️ กรุณากรอกชื่อสินค้าและราคากลางให้ถูกต้องครับ');
            }

            const payload = {
                name: name,
                price: price,
                items_per_pack: pack,
                sort_order: sort,
                color_code: color // 👈 ส่งข้อมูลรหัสสีไปบันทึก
            };

            if (pId) {
                const { error } = await _supabase.from('products').update(payload).eq('id', pId);
                if (error) return alert('ไม่สามารถอัปเดตข้อมูลสินค้าได้: ' + error.message);
                alert('🎉 อัปเดตข้อมูลสินค้าเรียบร้อย!');
            } else {
                const { error } = await _supabase.from('products').insert([payload]);
                if (error) return alert('ไม่สามารถเพิ่มสินค้าใหม่ได้: ' + error.message);
                alert('🎉 เพิ่มสินค้าใหม่เข้าระบบสำเร็จ!');
            }

            closeProductModal();
            fetchAllProducts();
        });

        document.getElementById('delete-product-btn').addEventListener('click', async () => {
            const pId = document.getElementById('product-modal-id').value;
            const name = document.getElementById('modal-product-name').value;

            if (!pId) return;

            const confirmDelete = confirm(`⚠️ คุณแน่ใจใช่ไหมว่าต้องการลบสินค้า [ ${name} ] ?\n\n*คำเตือน: หากสินค้านี้ถูกผูกอยู่ในสต็อกของบูธต่างๆ ระบบอาจจะเกิดข้อผิดพลาดในการคำนวณยอดสะสม*`);
            if (!confirmDelete) return;

            const { error } = await _supabase.from('products').delete().eq('id', pId);
            if (error) {
                return alert('ไม่สามารถลบสินค้าได้ เนื่องจากมีการอ้างอิงอยู่ในประวัติคลังสินค้า: ' + error.message);
            }

            alert('ลบสินค้าออกจากระบบเรียบร้อยแล้ว');
            closeProductModal();
            fetchAllProducts();
        });

        if (typeof _supabase === 'undefined') {
            alert('Error: ไม่สามารถดึง config.js ได้ กรุณาตรวจสอบตำแหน่งไฟล์');
        } else {
            fetchAllProducts();
        }
    </script>
</body>
</html>
